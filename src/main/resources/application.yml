server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: library-management

  # ====================================================================
  # CẤU HÌNH DATABASE & JPA
  # ====================================================================
  datasource:
    url: jdbc:mysql://localhost:3306/Library_Management_System?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # update: tự động tạo/cập nhật bảng theo Entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ====================================================================
  # CẤU HÌNH REDIS (CACHE & TOKEN MANAGEMENT)
  # ====================================================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

# ====================================================================
# CẤU HÌNH JWT (Dành cho việc tạo & xác thực Token sau này)
# ====================================================================
jwt:
  # Secret key (tối thiểu 256-bit / 32 ký tự đối với thuật toán HS256)
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # Thời gian hết hạn của Access Token (ms) - 300000 ms = 5 phút
  expiration: 300000
  access-expiration: 300000
  # Thời gian hết hạn của Refresh Token (ms) - ví dụ: 604800000 ms = 7 ngày
  refresh-expiration: 604800000

logging:
  level:
    com.library: DEBUG
    org.springframework.web: INFO
  file:
    name: logs/library-management.log
  logback:
    rollingpolicy:
      file-name-pattern: "logs/library-management-%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# ====================================================================
# CẤU HÌNH SWAGGER / OPENAPI (SPRINGDOC)
# ====================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
